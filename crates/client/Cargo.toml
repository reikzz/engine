[package]
name = "client"
version = "0.1.0"
edition = "2024"

[dependencies]
engine-core = { path = "../core" }
wgpu = "24"
winit = { version = "0.30" }
egui = "0.31"
egui-wgpu = { version = "0.31", features = ["winit"] }
egui-winit = { version = "0.31", default-features = false, features = ["clipboard", "links"] }
slint = { version = "1.18", default-features = false, features = ["std", "renderer-software", "compat-1-18"] }
bytemuck = { version = "1.21", features = ["derive"] }
glam = "0.29"
earcutr = "0.4"
crossbeam-channel = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ron = "0.12"
pollster = "0.4"

[build-dependencies]
slint-build = "1.18"
